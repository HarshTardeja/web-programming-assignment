    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Task 8 Gallery Layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            justify-content: center;
        }
        .gallery-item {
            width: 200px;
            height: 200px;
            border: 2px solid #ccc;
            margin: auto;
            border-radius: 8px;
            overflow: hidden;
            display: block;
            transition: all 0.3s;
        }
        .gallery-item:hover {
            border-color: var(--primary-blue);
            transform: translateY(-5px); /* Hover effect */
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Mobile adjustment for 2x3 */
        @media(max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        /* Task 44 Z-index Gallery */
        .stack-gallery {
            position: relative;
            height: 400px;
            width: 100%;
            margin-top: 20px;
        }
        .stack-img {
            position: absolute;
            width: 300px;
            height: 200px;
            border: 5px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.3s, z-index 0s;
        }
        /* Positions */
        .stack-img:nth-child(1) { top: 20px; left: 20%; transform: rotate(-10deg); z-index: 1; }
        .stack-img:nth-child(2) { top: 50px; left: 35%; transform: rotate(5deg); z-index: 2; }
        .stack-img:nth-child(3) { top: 80px; left: 50%; transform: rotate(-5deg); z-index: 3; }
        .stack-img:hover { box-shadow: 0 8px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

        <h2 class="text-center mt-5">Interactive Stack Gallery <span class="badge bg-primary ms-2" style="font-size: 0.5em;">Task [ 44 ]</span></h2>
        <p class="text-center text-muted">Click an image to bring it to the front.</p>
        <div class="stack-gallery" id="task44-gallery">

            <img src="https://loremflickr.com/300/200/green?lock=6" class="stack-img" alt="Photo 2">

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        // Task 44 Logic: Click to bring to front
        const images = document.querySelectorAll('.stack-img');
        if (images.length > 0) {
            images.forEach((img, index) => {
                img.addEventListener('click', function() {
                    // Reset all to base z-index (1, 2, 3 based on initial setup)
                    images.forEach((i, idx) => i.style.zIndex = idx + 1);
                    // Bring clicked to front
                    this.style.zIndex = 10;
                });
            });
        }
    </script>
